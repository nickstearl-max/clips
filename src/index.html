<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; img-src 'self' media: data:; media-src media:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>Clips</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- ============ LIBRARY ============ -->
  <div id="library">
    <header id="topbar">
      <div class="top-fade"></div>
      <div class="top-row">
        <div class="titles">
          <h1 id="big-title">Library</h1>
          <div id="subtitle">Loading…</div>
        </div>
        <div class="top-actions">
          <button class="glass-btn" id="btn-folder" title="Choose folder">
            <svg viewBox="0 0 24 24"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h3.6a2 2 0 0 1 1.4.6l1.3 1.3a2 2 0 0 0 1.4.6h5.3A2.5 2.5 0 0 1 21 10v6.5a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 16.5z"/></svg>
          </button>
          <button class="glass-btn" id="btn-refresh" title="Refresh">
            <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v4.5h-4.5"/></svg>
          </button>
        </div>
      </div>
    </header>

    <main id="scroller">
      <div id="sections"></div>
      <div id="footer-count"></div>
    </main>

    <div id="empty" hidden>
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m10 9.5 4.5 2.5-4.5 2.5z"/></svg>
      <h2>No clips here</h2>
      <p id="empty-msg">Nothing matches this filter.</p>
      <button class="empty-btn" id="empty-folder" hidden>Choose Folder</button>
    </div>

    <nav id="bottombar">
      <div class="seg glass" id="filters">
        <span class="seg-pill"></span>
        <button data-filter="all" class="on">All</button>
        <button data-filter="video">Videos</button>
        <button data-filter="image">Photos</button>
        <button data-filter="fav">Favorites</button>
      </div>
      <div class="zoom glass">
        <button id="zoom-out" title="Smaller (Ctrl −)"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
        <button id="zoom-in" title="Bigger (Ctrl +)"><svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg></button>
      </div>
    </nav>
  </div>

  <!-- ============ VIEWER ============ -->
  <div id="viewer" hidden>
    <div class="v-bg"></div>
    <div class="v-stage" id="stage"></div>

    <div class="v-top chrome">
      <button class="v-back" id="v-back" title="Back (Esc)">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="v-title">
        <div id="v-date"></div>
        <div id="v-time"></div>
      </div>
      <div class="v-actions">
        <button class="glass-btn" id="v-fav" title="Favorite (F)"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg></button>
        <button class="glass-btn" id="v-info" title="Info (I)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.6v.2"/></svg></button>
        <button class="glass-btn" id="v-reveal" title="Show in folder"><svg viewBox="0 0 24 24"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h3.6a2 2 0 0 1 1.4.6l1.3 1.3a2 2 0 0 0 1.4.6h5.3A2.5 2.5 0 0 1 21 10v6.5a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 16.5z"/></svg></button>
        <button class="glass-btn danger" id="v-trash" title="Delete (Del)"><svg viewBox="0 0 24 24"><path d="M4.5 7h15M9.5 7V5.2c0-.7.5-1.2 1.2-1.2h2.6c.7 0 1.2.5 1.2 1.2V7M6.5 7l.8 11.3c.1 1 .9 1.7 1.9 1.7h5.6c1 0 1.8-.7 1.9-1.7L17.5 7M10 11v5M14 11v5"/></svg></button>
      </div>
    </div>

    <button class="v-nav prev chrome" id="v-prev" title="Previous (←)"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="v-nav next chrome" id="v-next" title="Next (→)"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>

    <div class="v-info glass" id="info-card" hidden></div>

    <div class="v-bottom chrome">
      <div class="controls glass" id="controls">
        <button id="c-play" class="c-play" title="Play / Pause (Space)">
          <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
          <svg class="i-pause" viewBox="0 0 24 24"><rect x="6.5" y="5" width="3.8" height="14" rx="1.2"/><rect x="13.7" y="5" width="3.8" height="14" rx="1.2"/></svg>
        </button>
        <span class="c-time" id="c-cur">0:00</span>
        <div class="scrub" id="scrub">
          <div class="scrub-track"><div class="scrub-buf" id="scrub-buf"></div><div class="scrub-fill" id="scrub-fill"></div></div>
          <div class="scrub-knob" id="scrub-knob"></div>
          <div class="scrub-tip" id="scrub-tip">0:00</div>
        </div>
        <span class="c-time" id="c-left">-0:00</span>
        <button id="c-speed" class="c-text" title="Playback speed (S)">1×</button>
        <button id="c-loop" class="c-icon" title="Loop (L)"><svg viewBox="0 0 24 24"><path d="M17 3.5 20 6.5l-3 3M4 11.5v-1a4 4 0 0 1 4-4h12M7 20.5l-3-3 3-3M20 12.5v1a4 4 0 0 1-4 4H4"/></svg></button>
        <div class="vol">
          <button id="c-mute" class="c-icon" title="Mute (M)">
            <svg class="i-vol" viewBox="0 0 24 24"><path d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a7.8 7.8 0 0 1 0 11"/></svg>
            <svg class="i-muted" viewBox="0 0 24 24"><path d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z"/><path d="m16 9.5 5 5M21 9.5l-5 5"/></svg>
          </button>
          <input type="range" id="c-vol" min="0" max="1" step="0.01" value="1" />
        </div>
        <button id="c-full" class="c-icon" title="Full screen (Enter)"><svg viewBox="0 0 24 24"><path d="M4 9V5.5A1.5 1.5 0 0 1 5.5 4H9M15 4h3.5A1.5 1.5 0 0 1 20 5.5V9M20 15v3.5a1.5 1.5 0 0 1-1.5 1.5H15M9 20H5.5A1.5 1.5 0 0 1 4 18.5V15"/></svg></button>
      </div>
      <div class="strip" id="strip"></div>
    </div>

    <div class="big-play" id="big-play"><svg viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg></div>
  </div>

  <!-- ============ ACTION SHEET ============ -->
  <div id="sheet" hidden>
    <div class="sheet-bg"></div>
    <div class="sheet-card">
      <div class="sheet-group">
        <div class="sheet-msg" id="sheet-msg">This clip will be moved to the Recycle Bin.</div>
        <button class="sheet-btn red" id="sheet-ok">Delete Video</button>
      </div>
      <button class="sheet-btn bold" id="sheet-cancel">Cancel</button>
    </div>
  </div>

  <div id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
